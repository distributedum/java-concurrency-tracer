name: Deploy visualizer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'viz/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site from viz/
        run: |
          mkdir -p _site
          cp viz/spacetime.html _site/index.html   # bare URL opens the visualizer
          cp viz/spacetime.html viz/template.html viz/core.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
